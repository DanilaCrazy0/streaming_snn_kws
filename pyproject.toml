[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-snn-kws"
version = "1.0.0"
description = "Streaming spiking neural network for keyword spotting on Google Speech Commands"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniil Shestakov" }]
dependencies = [
  "torch>=2.1",
  "numpy",
  "librosa",
  "soundfile",
  "pandas",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["snn_kws*"]
